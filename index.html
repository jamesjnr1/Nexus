<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#07090b">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm operating system for a busy student-founder; quiet, precise, confident.
   IDEA: a well-ruled personal ledger / control room: every responsibility on one sheet.
   PICTURE: the working thing itself: an "Up next" schedule with large hanging dates and a six-area strip.
   COLOUR and TYPE: white ground, near-black ink rail, vermilion for urgency; one colour per area as small squares. DM Sans only.
   LAYOUT: fixed rail + wide sheet; ruled rows, square corners, no pills; stacks to one column on phones. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e1011);--panel:light-dark(#f6f6f4,#15181a);--line:light-dark(#e3e3de,#272b2e);
--ink:light-dark(#111416,#eceeef);--mute:light-dark(#5b6166,#99a0a6);--soft:light-dark(#8a9095,#6f767c);
--rail:#0f1213;--railink:#eceeef;--railmute:#8b9296;--accent:#e5482d;--ok:light-dark(#0b7a52,#38c98f);
--c-academics:#3b5bdb;--c-business:#0b8a5f;--c-leadership:#d6336c;--c-finance:#d99a00;--c-ideas:#7048e8;--c-growth:#0c8599;--c-general:#868e96;
--r:2px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif;overflow-x:clip;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{background:var(--rail);color:var(--railink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.brand{display:grid;grid-template-columns:30px auto;gap:0 11px;align-items:center;padding:0 8px;text-decoration:none}
.brand svg{width:30px;height:30px;grid-row:span 2}
.brand b{font-size:19px;font-weight:700;letter-spacing:.14em;line-height:1}
.brand small{font-size:11px;color:var(--railmute);line-height:1.3;margin-top:3px}
/* finance */
.mnav{display:flex;align-items:center;gap:4px;margin-top:10px;flex-wrap:wrap}
.mnav b{font-size:17px;min-width:84px;text-align:center}
.mnav .ic{font-size:20px;width:36px;height:36px;border:1px solid var(--line)}
.o{color:var(--accent);font-weight:700}.i{color:var(--ok);font-weight:700}
.fov{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:40px;align-items:stretch}
.gauge{text-align:center}.gauge svg{width:100%;max-width:260px;display:block;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin-top:14px}
.tile{--cc:#999;align-content:start;background:color-mix(in srgb,var(--cc) 10%,var(--card));border:0;border-radius:4px;padding:14px 12px 12px;text-align:left;cursor:pointer;display:grid;gap:6px;color:var(--ink)}
.tile:hover{outline:1.5px solid var(--cc)}
.tile .ico{width:34px;height:34px;background:var(--cc);color:#fff;display:grid;place-items:center;border-radius:3px;margin-bottom:4px}
.tile .nm{font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .amt{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.tile .bud{font-size:12px;color:var(--mute)}
.tile .meter{height:5px;margin:0;background:color-mix(in srgb,var(--cc) 22%,transparent)}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:1px solid var(--line);margin-top:14px}
.bars i{flex:1;background:linear-gradient(to top,var(--c-finance),color-mix(in srgb,var(--c-finance) 60%,#fff));border-radius:4px 4px 0 0;display:block;min-height:1px}
.bars i.t{background:var(--accent)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--line)}
.cal>span{font-size:12px;font-weight:600;color:var(--mute);padding:8px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal button{border:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:none;min-height:82px;padding:6px;text-align:left;cursor:pointer;font-size:12px;display:flex;flex-direction:column;gap:1px;line-height:1.3}
.cal button:hover{background:var(--panel)}
.cal button .dn{font-size:15px;font-weight:600;margin-bottom:2px}
.cal button.td .dn{color:var(--accent)}
.cal button.sel{background:color-mix(in srgb,var(--c-finance) 24%,var(--bg))}
.cal .blank{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--panel) 6px 7px);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.dayh{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--mute);padding:16px 0 6px;border-bottom:1px solid var(--line)}
.tx{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tx .ico{width:34px;height:34px;color:#fff;display:grid;place-items:center;border-radius:3px}
.tx .amt{font-weight:700;white-space:nowrap;text-align:right}
.leg{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.leg i{width:10px;height:10px;display:block}.leg .r{color:var(--mute);font-size:13px;text-align:right;white-space:nowrap}
.donut{max-width:240px;margin:8px auto 0;display:block;width:100%}
@media(max-width:760px){.fov{grid-template-columns:1fr}.cal button{min-height:58px;padding:4px;font-size:10px}.cal button .dn{font-size:13px}}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:0 10px;height:40px;text-decoration:none;color:var(--railmute);border-radius:var(--r);font-weight:500}
.nav a:hover{color:var(--railink);background:#1b2022}
.nav a[aria-current=page]{color:var(--railink);background:#20262a}
.nav a .n{margin-left:auto;font-size:13px;color:var(--railmute)}
.sw{display:inline-block;width:9px;height:9px;flex:none;vertical-align:middle;margin-right:7px;position:relative;top:-1px}
.nav .sw{margin:0}
.railfoot{margin-top:auto;font-size:13px;color:var(--railmute);display:grid;gap:8px;padding:0 8px}
.railfoot h4{margin:0 0 2px;font-size:13px;color:var(--railink);font-weight:600}
.conn{display:flex;align-items:center;gap:8px}.conn i{width:7px;height:7px;background:#4a5257;flex:none}.conn.on i{background:#38c98f}
.linkbtn{background:none;border:0;padding:0;color:var(--railmute);text-decoration:underline;cursor:pointer;font-size:13px;text-align:left}
.linkbtn:hover{color:var(--railink)}
/* main */
main{padding:22px clamp(16px,3.4vw,48px) 64px;max-width:1320px;width:100%}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:28px}
.cap{flex:1 1 360px;display:flex;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.cap:focus-within{border-color:var(--ink)}
.cap input{flex:1;border:0;background:none;height:46px;padding:0 14px;font-size:16px;outline:0}
.seg{display:flex;border-left:1px solid var(--line)}
.seg button{border:0;background:none;padding:0 12px;height:46px;cursor:pointer;color:var(--mute);font-size:14px;font-weight:500}
.seg button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.status{font-size:13px;color:var(--mute);white-space:nowrap}
h1{font-size:clamp(30px,4vw,44px);line-height:1.05;letter-spacing:-.025em;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:20px;letter-spacing:-.01em;margin:0;font-weight:700}
h3{font-size:16px;margin:0;font-weight:600}
.sub{color:var(--mute);margin:8px 0 0;font-size:17px}
.sub b{color:var(--ink);font-weight:600}.sub .late{color:var(--accent)}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.sec{margin-top:36px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:4px;flex-wrap:wrap}
.sh .note{font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:40px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:var(--r);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.sm{height:34px;padding:0 10px;font-size:13px}
.add{background:none;border:0;color:var(--mute);font-weight:600;font-size:14px;cursor:pointer;padding:6px 0;min-height:36px}
.add:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* area strip */
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.strip a{padding:14px 14px 16px;text-decoration:none;border-left:1px solid var(--line);display:grid;gap:2px}
.strip a:first-child{border-left:0;padding-left:0}
.strip a:hover .big{color:var(--accent)}
.strip .lbl{font-size:13px;font-weight:600;color:var(--mute)}
.strip .big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.strip .nx{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tasks */
.tabs{display:flex;gap:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:4px 0;color:var(--mute);font-size:14px;font-weight:500;cursor:pointer;min-height:32px}
.tabs button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
ul.list{list-style:none;margin:0;padding:0}
.trow{display:grid;grid-template-columns:56px 30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}
.when{line-height:1;padding-top:1px}
.when b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em}
.when span{display:block;white-space:nowrap;font-size:12px;color:var(--mute);margin-top:3px;font-weight:600}
.when.late b,.when.late span{color:var(--accent)}
.chk{width:22px;height:22px;margin-top:3px;border:1.5px solid var(--soft);background:none;border-radius:var(--r);cursor:pointer;display:grid;place-items:center;padding:0}
.chk svg{width:14px;height:14px;opacity:0}
.chk:hover{border-color:var(--ink)}
.done .chk{background:var(--ink);border-color:var(--ink)}.done .chk svg{opacity:1;stroke:var(--bg)}
.done .tt{text-decoration:line-through;color:var(--soft)}
.tt{font-weight:500;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--mute);margin-top:2px}
.meta .late{color:var(--accent);font-weight:600}.hi{color:var(--accent);font-weight:600}
.ra{display:flex;gap:2px;opacity:.35;transition:opacity .15s}
li:hover .ra,.ra:focus-within,.card:hover .ra,tr:hover .ra{opacity:1}
.ic{width:32px;height:32px;border:0;background:none;cursor:pointer;display:grid;place-items:center;border-radius:var(--r);color:var(--mute)}
.ic:hover{background:var(--panel);color:var(--ink)}
.ic svg{width:16px;height:16px}
.empty{padding:22px 0;color:var(--mute);font-size:15px}
/* side widgets */
.side{display:grid;gap:34px;align-content:start}
.ev{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.ev .t{color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap;padding-top:1px}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.figs>div{padding:12px 12px 12px 0}
.figs>div+div{padding-left:12px;border-left:1px solid var(--line)}
.figs .k{font-size:13px;color:var(--mute);font-weight:600}
.figs .v{font-size:clamp(20px,2.2vw,26px);font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.figs .v.neg{color:var(--accent)}
.meter{height:8px;background:var(--panel);margin-top:6px;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;display:block}
.meter.over i{background:var(--accent)!important}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.mrow .meter{grid-column:1/-1}
.mrow .r{font-size:13px;color:var(--mute);white-space:nowrap}
.claude{margin-top:18px;padding:16px;background:var(--panel);border-left:3px solid var(--ink)}
.claude .out{white-space:pre-wrap;font-size:15px;margin-top:10px}
.claude .when2{font-size:12px;color:var(--mute);margin-top:8px}
/* cards & tables */
.card{padding:18px 0;border-bottom:1px solid var(--line)}
.ch{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.tag{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap}
.tag.Active{color:var(--ok)}.tag.Paused{color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:10px 8px 8px 0;border-bottom:1px solid var(--line)}
td{padding:11px 8px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.inc{color:var(--ok)}
.stat{background:none;border:1px solid var(--line);border-radius:var(--r);font-size:13px;font-weight:600;padding:4px 8px;cursor:pointer;white-space:nowrap}
.stat.Open{color:var(--accent);border-color:currentColor}.stat.Resolved{color:var(--ok)}
/* study plan */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.day{border-left:1px solid var(--line);padding:10px 8px;min-height:150px}
.day:first-child{border-left:0;padding-left:0}
.day h4{margin:0 0 8px;font-size:13px;color:var(--mute)}
.day.now h4{color:var(--accent)}
.blk{padding:7px 8px;background:var(--panel);margin-bottom:6px;font-size:13px;cursor:pointer;border:0;text-align:left;width:100%;border-radius:var(--r);display:block}
.blk b{display:block;font-size:13px}
.blk:hover{outline:1px solid var(--ink)}
/* ideas */
.idea{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.rank{font-size:22px;font-weight:700;color:var(--c-ideas);line-height:1.2}
.dfv{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.dfv>div{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);font-weight:600}
.dots{display:flex;gap:3px}
.dots button{width:18px;height:18px;border:1px solid var(--soft);background:none;padding:0;cursor:pointer;border-radius:1px}
.dots button.on{background:var(--c-ideas);border-color:var(--c-ideas)}
.score{font-size:24px;font-weight:700;letter-spacing:-.02em;text-align:right;line-height:1.1}
.score small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
select.inl{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);height:32px;padding:0 6px;font-size:13px}
/* growth */
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;margin:14px 0 6px}
.heat i{background:var(--panel);display:block}
.cklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.ck{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.ck .chk{margin:0}
.ck.done span{color:var(--soft);text-decoration:line-through}
.ck.done .chk{background:var(--ink);border-color:var(--ink)}.ck.done .chk svg{opacity:1;stroke:var(--bg)}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(10,12,13,.45);display:grid;place-items:center;padding:16px;z-index:20}
.ov[hidden]{display:none}
.sheet{background:var(--bg);width:min(520px,100%);max-height:90vh;overflow:auto;padding:24px;border-radius:var(--r);box-shadow:0 24px 60px rgba(0,0,0,.3)}
.sheet h3{font-size:20px;margin-bottom:14px}
.fld{display:grid;gap:5px;margin-bottom:12px}
.fld span{font-size:13px;font-weight:600;color:var(--mute)}
.fld input,.fld select,.fld textarea{width:100%;font-size:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:0 12px;height:44px}
.fld textarea{height:auto;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ink);outline:0}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--rail);color:var(--railink);padding:10px 12px 10px 16px;display:flex;gap:16px;align-items:center;font-size:14px;z-index:30;border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:#fff;font-weight:700;text-decoration:underline;cursor:pointer;min-height:32px}
.starter{font-size:13px;color:var(--mute);margin-top:10px}
.view{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
@media(prefers-reduced-motion:reduce){.view{animation:none}}
@media(max-width:1080px){.grid2{grid-template-columns:1fr}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.strip a:nth-child(4){border-left:0;padding-left:0}.strip a:nth-child(n+4){border-top:1px solid var(--line)}}
@media(max-width:900px){.app{grid-template-columns:1fr}
.rail{position:sticky;top:0;height:auto;z-index:10;padding:10px 12px;gap:8px;flex-direction:row;align-items:center}
.nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}.nav a{flex:none;height:36px}.nav a .n{display:none}
.railfoot{display:none}.grid2e{grid-template-columns:1fr}.week{grid-template-columns:repeat(2,minmax(0,1fr))}.day{border-left:0;padding-left:0;border-bottom:1px solid var(--line);min-height:0}}
@media(max-width:900px){.brand small{display:none}.brand{grid-template-columns:28px auto}}
@media(max-width:600px){.brand b{display:none}.tx{grid-template-columns:34px minmax(0,1fr) auto}.tx .ra{grid-column:2}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip a{border-left:0!important;padding-left:0!important;border-top:1px solid var(--line)}
.figs{grid-template-columns:1fr}.figs>div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}
.trow{grid-template-columns:52px 28px minmax(0,1fr)}.when span{font-size:11px}.trow .ra{grid-column:3;opacity:1}
.cklist{grid-template-columns:1fr}.seg button{padding:0 9px}table{font-size:13px}
.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute);font-size:12px}.stack td:empty{display:none}}
/* ---- v2 visual layer ---- */
:root{--bg:light-dark(#f2f3f0,#0a0c0d);--card:light-dark(#ffffff,#141719);--panel:light-dark(#f1f2ee,#1d2124);--line:light-dark(#e8e9e4,#25292c);--shadow:0 1px 2px rgba(16,20,22,.04),0 6px 20px rgba(16,20,22,.05)}
main section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
.grid2,.grid2e,.fov{gap:18px}.side{gap:18px}.sec{margin-top:18px}
.sh{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px;align-items:center}

m.querySelector('form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const vals={};sp.f.forEach(([k,,t])=>{let v=fd.get(k);if(t==='number')v=parseFloat(v)||0;if(t==='url'&&v&&!/^https:\/\//.test(v))v='https://'+String(v).replace(/^\w+:\/\//,'');vals[k]=typeof v==='string'?v.trim():v});

document.addEventListener('change',e=>{const s=e.target.closest('[data-act="stage"]');if(s){const i=S.ideas.find(x=>x.id===s.dataset.id);if(i){i.stage=s.value;commit()}}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)close();if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#capin').focus()}});
$('#clearStarter').onclick=()=>{const before=JSON.stringify(S);['courses','tasks','meetings','issues','txns','budgets','goals','books','blocks'].forEach(c=>S[c]=S[c].filter(x=>!x.s));commit();toast('Starter entries cleared',()=>{S=JSON.parse(before)})};
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* quick capture */
let capKind='task';
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{capKind=b.dataset.k;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#capin').placeholder=capKind==='task'?'Capture anything… e.g. Pitch deck review tomorrow':capKind==='idea'?'An idea worth keeping…':'e.g. 45 lunch  or  120 data bundle';$('#capin').focus()});
function parseDue(txt){let t=txt,due='';const lw=t.toLowerCase();const dn=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
if(/\btoday\b/.test(lw)){due=today();t=t.replace(/\s*\btoday\b/i,'')}else if(/\btomorrow\b/.test(lw)){due=plus(1);t=t.replace(/\s*\btomorrow\b/i,'')}
else{for(let k=0;k<7;k++){const re=new RegExp('\\s*\\b(on |by )?('+dn[k]+'|'+dn[k].slice(0,3)+')\\b','i');if(re.test(t)){let n=(k-new Date().getDay()+7)%7||7;due=plus(n);t=t.replace(re,'');break}}}
return{title:t.trim(),due}}
function guessArea(t){const l=t.toLowerCase();const hit=(arr)=>arr.some(w=>l.includes(w));
for(const c of S.courses)if(l.includes(c.name.toLowerCase()))return['academics',c.name];
for(const v of S.ventures)if(l.includes(v.name.toLowerCase().split(' ')[0]))return['business',v.name];
if(hit(['parliament','constituent','pr committee']))return['leadership','Parliament'];if(hit(['ascend','campaign','vetting','asc']))return['leadership','Ascend campaign'];
if(hit(['assignment','exam','quiz','problem set','lecture','essay','reading for']))return['academics',''];if(hit(['cs50','practice','read ']))return['growth',''];return['general','']}
$('#capf').onsubmit=e=>{e.preventDefault();const v=$('#capin').value.trim();if(!v)return;
if(capKind==='idea'){S.ideas.unshift({id:uid(),title:v,notes:'',stage:'Seed',d:0,f:0,v:0,dev:''});toast('Idea captured')}
else if(capKind==='expense'){const m=v.match(/(\d+(?:\.\d+)?)/);if(!m){toast('Add an amount, e.g. 45 lunch');return}const label=v.replace(m[0],'').replace(/\s+/g,' ').trim()||'Expense';const l=label.toLowerCase();
const cat=/data|airtime|bundle/.test(l)?'Data & airtime':/trotro|uber|bolt|taxi|transport|fare/.test(l)?'Transport':/lunch|food|dinner|breakfast|snack/.test(l)?'Food':/domain|hosting|vercel|subscription|software/.test(l)?'Software & hosting':/rent|hostel/.test(l)?'Rent & hostel':/book|print|school|fees/.test(l)?'School':'Other';
S.txns.unshift({id:uid(),label,type:'Expense',amount:parseFloat(m[1]),category:cat,project:'',date:today()});toast(`Logged ${money(parseFloat(m[1]))} · ${cat}`)}
else{const p=parseDue(v);const[area,r]=guessArea(p.title);S.tasks.unshift({id:uid(),title:p.title||v,area,ref:r,due:p.due,pri:'Normal',done:false,notes:''});toast(`Task added to ${AREAS[area]}${p.due?' · '+rel(p.due):''}`)}
$('#capin').value='';commit()};


const clockStr=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=clockStr()},1000);
DRAW.orbit=function(s){const W=s.clientWidth,H=s.clientHeight;if(!W)return;const cx=W/2,cy=H/2-8,R=Math.min(W*.37,H*.37);const A=['academics','business','leadership','finance','ideas','growth'];
let g=`<defs><radialGradient id="og"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><filter id="gl" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="7"/></filter></defs>`;
g+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(255,255,255,.08)"/><circle cx="${cx}" cy="${cy}" r="${R*.55}" fill="none" stroke="rgba(255,255,255,.06)" stroke-dasharray="2 6" class="spin"/><circle cx="${cx}" cy="${cy}" r="${R*1.22}" fill="none" stroke="rgba(255,255,255,.04)"/>`;
const nodes=A.map((a,k)=>{const ang=-Math.PI/2+k*Math.PI/3;let items,count;
if(a==='finance'){items=fin().tx.slice(0,6).map(t=>({late:false}));count=fin().tx.length}else if(a==='ideas'){items=S.ideas.filter(i=>i.stage!=='Parked').slice(0,6).map(()=>({late:false}));count=items.length}else{const o=open(a).sort(byDue);items=o.slice(0,7).map(t=>({late:t.due&&diff(t.due)<0}));count=o.length}
return{a,ang,x:cx+R*Math.cos(ang),y:cy+R*Math.sin(ang),items,count}});
nodes.forEach(n=>{g+=`<line x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="var(--c-${n.a})" stroke-opacity=".35" stroke-width="1.2"/><line x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="var(--c-${n.a})" stroke-width="2" class="flow"/>`});
for(let k=0;k<6;k++){const p=nodes[k],q=nodes[(k+1)%6];g+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="rgba(255,255,255,.05)"/>`}
g+=`<circle cx="${cx}" cy="${cy}" r="${R*.42}" fill="url(#og)"/><circle cx="${cx}" cy="${cy}" r="30" fill="#0b0e10" stroke="rgba(255,255,255,.18)"/><g transform="translate(${cx-14} ${cy-14}) scale(.875)"><rect x="3" y="3" width="7" height="26" fill="#eef1f3"/><rect x="22" y="3" width="7" height="26" fill="#eef1f3"/><path d="M10 3h4.6L22 20.5V29h-4.6L10 11.5z" fill="#ff5a3d"/></g>`;
nodes.forEach(n=>{const r=17+Math.min(n.count,8)*1.3;const sat=n.items.map((t,i)=>{const N=n.items.length;const aa=n.ang+(i-(N-1)/2)*.42;const d=r+14;return`<circle cx="${n.x+d*Math.cos(aa)}" cy="${n.y+d*Math.sin(aa)}" r="${t.late?4.5:3.2}" fill="${t.late?'#ff5a3d':`var(--c-${n.a})`}" ${t.late?'filter="drop-shadow(0 0 4px #ff5a3d)"':'fill-opacity=".75"'}/>`}).join('');
const below=Math.sin(n.ang)>-.2;const ly=below?n.y+r+(n.items.length?34:20):n.y-r-(n.items.length?40:24);
g+=`<a href="#${n.a}"><circle cx="${n.x}" cy="${n.y}" r="${r+6}" fill="var(--c-${n.a})" opacity=".45" filter="url(#gl)"/><circle class="nd" cx="${n.x}" cy="${n.y}" r="${r}" fill="var(--c-${n.a})" stroke="rgba(255,255,255,.35)"/><text x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">${n.count}</text>${sat}<text x="${n.x}" y="${ly}" text-anchor="middle" font-size="12.5" font-weight="600" fill="#eef1f3">${AREAS[n.a]}</text></a>`});
s.innerHTML=g};
/* command palette */
let palSel=0,palItems=[];
function palOpen(){close();$('#pal').hidden=false;$('#palin').value='';palSel=0;palRender();setTimeout(()=>$('#palin').focus(),10)}
function palClose(){$('#pal').hidden=true}
function palRender(){const q=$('#palin').value.trim().toLowerCase();const items=[];
VIEWS.forEach(v=>items.push({g:'Go to',t:VNAME[v],ic:v,run:()=>{location.hash=v}}));
[['New task','plus',()=>openForm('task')],['New idea','ideas',()=>openForm('idea')],['Log expense','finance',()=>openForm('txn',null,{category:'Food',type:'Expense'})],['Log income','growth',()=>openForm('txn',null,{category:'Project income',type:'Income'})],['Log practice session','code',()=>openForm('practice')],['Log constituent issue','users',()=>openForm('issue')],['New meeting','calendar',()=>openForm('meeting')]].forEach(([t,ic,run])=>items.push({g:'Actions',t,ic,run}));
if(sample)items.push({g:'Actions',t:'Plan my week with Claude',ic:'spark',run:()=>{location.hash='today';plan()}});
if(q){S.tasks.forEach(t=>items.push({g:'Tasks',t:t.title,sub:AREAS[t.area]+(t.ref?' · '+t.ref:'')+(t.done?' · done':''),ic:t.area,run:()=>openForm('task',t.id)}));S.ideas.forEach(i=>items.push({g:'Ideas',t:i.title,sub:i.stage,ic:'ideas',run:()=>openForm('idea',i.id)}));S.txns.forEach(x=>items.push({g:'Money',t:x.label,sub:x.category+' · '+money(+x.amount||0),ic:'finance',run:()=>openForm('txn',x.id)}));S.ventures.forEach(v=>items.push({g:'Ventures',t:v.name,sub:v.role,ic:'business',run:()=>{location.hash='business'}}))}
palItems=(q?items.filter(i=>(i.t+' '+(i.sub||'')+' '+i.g).toLowerCase().includes(q)):items).slice(0,14);palSel=Math.min(palSel,Math.max(0,palItems.length-1));
let last='';$('#pallist').innerHTML=palItems.map((i,n)=>{const h=i.g!==last?`<div class="pg">${i.g}</div>`:'';last=i.g;return h+`<button class="pi ${n===palSel?'on':''}" data-n="${n}">${it(i.ic,AREAS[i.ic]?'var(--c-'+i.ic+')':'var(--ink)')}<span><b>${esc(i.t)}</b>${i.sub?`<small>${esc(i.sub)}</small>`:''}</span></button>`}).join('')||'<p class="empty" style="padding:16px">No matches.</p>';
const on=$('#pallist .pi.on');if(on)on.scrollIntoView({block:'nearest'})}
function palRun(n){const i=palItems[n];if(!i)return;palClose();i.run()}
$('#palin').addEventListener('input',()=>{palSel=0;palRender()});
$('#palin').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palItems.length-1);palRender()}else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);palRender()}else if(e.key==='Enter'){e.preventDefault();palRun(palSel)}else if(e.key==='Escape'){palClose()}});
$('#pallist').addEventListener('click',e=>{const b=e.target.closest('.pi');if(b)palRun(+b.dataset.n)});
$('#pal').addEventListener('click',e=>{if(e.target.id==='pal')palClose()});
$('#kbtn').onclick=palOpen;
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal').hidden?palOpen():palClose()}});

/* ---------- boot ---------- */
render();status('Saved on this device');
$('#expBtn').onclick=()=>{try{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nexus-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}catch{toast('Export isn’t available here')}};
$('#impBtn').onclick=()=>$('#impFile').click();
$('#impFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.tasks))throw 0;const before=JSON.stringify(S);S=d;commit();toast('Data imported',()=>{S=JSON.parse(before)})}catch{toast('That file isn’t a Nexus backup')}e.target.value=''};
(async()=>{const C=window.claude;if(!C||!C.use){status('Saved in this browser');$('#backup').hidden=false;return}
const [db,user,mcp,smp]=await Promise.all([C.use('db'),C.use('user'),C.use('mcp'),C.use('sample')]);
if(smp){sample=smp;$('#c-ai').classList.add('on');render()}
if(mcp){CAL.state='loading';render();try{mcp.watchTool('Google Calendar','list_events',{pageSize:12,orderBy:'startTime'},ev=>{if(ev&&ev.type==='data'){CAL={state:'on',events:parseEvents(ev.result&&ev.result.payload)};$('#c-cal').classList.add('on')}else if(ev&&ev.type==='error'){CAL.state='error';$('#c-cal').classList.remove('on')}if(cur()==='today')render()},{refetchInterval:600000})}catch{CAL.state='error';render()}}
const id=user?await user.id():null;if(!db||!id){status('Saved on this device only');return}
ref=db.doc('data/users/'+id+'/os');const tm=setTimeout(()=>status('Can’t reach your account yet'),10000);
ref.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites)return;if(!snap.metadata.fromCache)clearTimeout(tm);$('#c-db').classList.add('on');
if(!snap.exists){if(!snap.metadata.fromCache){status('Saved');flush()}return}
const d=snap.data();if(!d||typeof d.json!=='string'||d.json===lastJSON)return;
if(writing||JSON.stringify(S)!==lastJSON&&lastJSON){return}
try{S=JSON.parse(d.json);lastJSON=d.json;try{localStorage.setItem('jos',d.json)}catch{}status('Saved');render()}catch{}},
err=>{clearTimeout(tm);status('Saved on this device only');ref=null})})();
}
</script>
